
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Tutor Chatbot</title>

    <link rel="stylesheet" href="../static/style.css">
</head>
<body>

    <main class="container">

        <!-- Welcome screen -->
        <section id="welcomeScreen" class="welcome-screen">
            <div class="bot-icon">AI</div>

            <h1>NDUVHO AI Chatbot</h1>

            <p>Your personal learning assistant.</p>

            <button id="chatButton" type="button">Chat</button>
        </section>

        <!-- Chat screen -->
        <section id="chatScreen" class="chat-screen" hidden>

            <header class="chat-header">
                <div>
                    <h2>NDUVHO AI CHATBOT</h2>
                    <p>Your learning assistant</p>
                </div>

                <button
                    id="backButton"
                    class="back-button"
                    type="button"
                >
                    Back
                </button>
            </header>

            <div id="chatMessages" class="chat-messages">
                <div class="message bot-message">
                    Hello! Welcome to NDUVHO AI CHATBOT.
                    What would you like to learn today?
                </div>
            </div>

            <form id="chatForm" class="chat-form">
                <input
                    type="text"
                    id="userInput"
                    placeholder="Ask me anything..."
                    autocomplete="off"
                    required
                >

                <button type="submit">Send</button>
            </form>

        </section>

    </main>

    <script src="../static/script.js"></script>

</body>
</html>
